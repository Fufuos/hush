[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hush"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
hush-core = { path = "../hush-core" }
reqwest = { version = "0.13.2", features = ["json"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
keyring = "2.3"
arboard = "3.6.1"
rand = "0.10.0"
rpassword = "7.4.0"
dirs = "6.0.0"
