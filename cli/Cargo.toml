[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hush"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
hush-core = { path = "../hush-core" }
reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1.49.0", features = ["full"] }
